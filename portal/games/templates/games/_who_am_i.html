<ul class="clues">
  {% for clue in clues %}
    <li>Clue {{ forloop.counter }}: {{ clue }}</li>
  {% endfor %}
</ul>
<div class="field">
  <label for="guess">Identify the figure:</label>
  <select id="guess" name="guess" hx-post="{% url 'games:guess' %}" hx-trigger="change" hx-target="#guess-result">
    <option value="">Select...</option>
    {% for name in names %}
      <option value="{{ name }}">{{ name }}</option>
    {% endfor %}
  </select>
</div>
<div id="guess-result" aria-live="polite"></div>
<div class="row">
  <button type="button" class="secondary" hx-post="{% url 'games:next_figure' %}" hx-target="#who-am-i">🔄 Next Target / Figure</button>
</div>
