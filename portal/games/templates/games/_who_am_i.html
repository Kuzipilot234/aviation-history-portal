<ol class="clues">
  {% for clue in clues %}
    <li><span>CLUE {{ forloop.counter }}</span> {{ clue }}</li>
  {% endfor %}
</ol>
<p class="label" id="guess-label" style="margin-bottom:10px">Identify the figure:</p>
<div class="guess-grid" role="group" aria-labelledby="guess-label">
  {% for name in names %}
    <button type="button" name="guess" value="{{ name }}" hx-post="{% url 'games:guess' %}" hx-target="#guess-result">{{ name }}</button>
  {% endfor %}
</div>
<div id="guess-result" aria-live="polite"></div>
<div class="game-foot">
  <button type="button" class="ghost small" hx-post="{% url 'games:next_figure' %}" hx-target="#who-am-i">Next figure <span aria-hidden="true">→</span></button>
</div>
