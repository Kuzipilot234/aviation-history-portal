{% load i18n %}<article class="announcement" data-tag="{{ item.tag }}">
  <div class="announcement-meta">
    <span class="chip{% if item.tag == 'feature' %} accent{% elif item.tag == 'fix' %} success{% endif %}">{{ item.tag_label }}</span>
    {% if item.is_new %}<span class="chip live">{% translate "New" context "announcement badge" %}</span>{% endif %}
    <time datetime="{{ item.date|date:'Y-m-d' }}">{{ item.date|date:"j M Y" }}</time>
  </div>
  <h3>{{ item.title }}</h3>
  <p>{{ item.message }}</p>
</article>
